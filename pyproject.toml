[project]
name = "dynamic-llm-api-sdk-examples"
version = "0.1.0"
description = "Dynamic multi-provider LLM SDK examples with CLI and Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.50.0",
  "dashscope>=1.24.0",
  "google-genai>=1.11.0",
  "httpx>=0.28.1",
  "openai>=1.76.0",
  "python-dotenv>=1.1.0",
  "streamlit>=1.44.0",
  "zai-sdk>=0.0.4",
]

[project.scripts]
llm-examples = "llm_examples.cli.main:main"

[dependency-groups]
dev = [
  "import-linter>=2.3",
  "mypy>=1.15.0",
  "pytest>=8.3.5",
  "pytest-cov>=6.1.1",
  "respx>=0.22.0",
  "ruff>=0.11.7",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-q --cov=llm_examples --cov=scripts --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
  "llm_examples/providers/*",
  "llm_examples/ui/*",
  "scripts/*",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["llm_examples"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_examples"]
